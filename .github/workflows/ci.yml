name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build and script tooling
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev shellcheck xvfb

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

      - name: Test Go packages with race detector
        run: go test -race ./cmd/... ./internal/...

      - name: Test X11 hotkey build
        run: xvfb-run -a -s "-screen 0 1024x768x24" go test -race -tags x11hotkey ./cmd/... ./internal/...

      - name: Vet Go packages
        run: go vet ./cmd/... ./internal/...

      - name: Run golangci-lint
        run: make lint

      - name: Run govulncheck
        run: make vulncheck

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Test installation lifecycle
        run: ./scripts/test-lifecycle.sh

      - name: Test release bootstrap
        run: ./scripts/test-bootstrap.sh

      - name: Test interactive prompts with a pseudo-terminal
        run: ./scripts/test-prompts-pty.sh

      - name: Build release archive
        env:
          RELEASE_VERSION: v0.0.0-ci.${{ github.run_number }}
        run: ./scripts/build-release.sh

      - name: Verify release archive
        env:
          RELEASE_ARCHIVE: dist/release/sttd-v0.0.0-ci.${{ github.run_number }}-linux-amd64.tar.gz
        run: make verify-release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sttd-linux-amd64
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

      - name: Test Go packages with race detector
        run: go test -race ./cmd/... ./internal/...
