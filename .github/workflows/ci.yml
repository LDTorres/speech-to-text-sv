name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install script tooling
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Test Go packages
        run: go test ./...

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Build release archive
        env:
          RELEASE_VERSION: v0.0.0-ci.${{ github.run_number }}
        run: ./scripts/build-release.sh

      - name: Verify release archive
        env:
          RELEASE_ARCHIVE: dist/release/sttd-v0.0.0-ci.${{ github.run_number }}-linux-amd64.tar.gz
        run: make verify-release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sttd-linux-amd64
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
