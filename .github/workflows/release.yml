name: Release validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install build and script tooling
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev shellcheck xvfb

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

      - name: Test Go packages with race detector
        run: go test -race ./cmd/... ./internal/...

      - name: Test X11 hotkey build
        run: xvfb-run -a -s "-screen 0 1024x768x24" go test -race -tags x11hotkey ./cmd/... ./internal/...

      - name: Vet Go packages
        run: go vet ./cmd/... ./internal/...

      - name: Run golangci-lint
        run: make lint

      - name: Run govulncheck
        run: make vulncheck

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Test installation lifecycle
        run: ./scripts/test-lifecycle.sh

      - name: Test release bootstrap
        run: ./scripts/test-bootstrap.sh

      - name: Test interactive prompts with a pseudo-terminal
        run: ./scripts/test-prompts-pty.sh
