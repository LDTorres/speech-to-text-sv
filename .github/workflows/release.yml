name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build and script tooling
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev shellcheck

      - name: Test Go packages
        run: go test ./cmd/... ./internal/...

      - name: Test Go packages with race detector
        run: go test -race ./cmd/... ./internal/...

      - name: Test X11 hotkey build
        run: go test -race -tags x11hotkey ./cmd/... ./internal/...

      - name: Vet Go packages
        run: go vet ./cmd/... ./internal/...

      - name: Run golangci-lint
        run: make lint

      - name: Run govulncheck
        run: make vulncheck

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Test installation lifecycle
        run: ./scripts/test-lifecycle.sh

      - name: Test release bootstrap
        run: ./scripts/test-bootstrap.sh

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.sha }}
        run: |
          release_args=(--tag "${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          ./scripts/publish-release.sh "${release_args[@]}"
